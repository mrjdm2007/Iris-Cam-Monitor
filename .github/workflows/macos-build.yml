name: macOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # macos-14 is a stable, widely available GitHub-hosted Xcode runner.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify shared scheme
        run: xcodebuild -list -project IrisCamMonitor.xcodeproj

      - name: Build Iris Cam Monitor
        run: |
          set -o pipefail
          xcodebuild \
            -project IrisCamMonitor.xcodeproj \
            -scheme IrisCamMonitor \
            -configuration Release
            -derivedDataPath build/DerivedData \
            -sdk macosx \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package macOS app
        run: |
          APP=build/DerivedData/Build/Products/Release/IrisCamMonitor.app
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" IrisCamMonitor-macOS.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: IrisCamMonitor-macOS
          path: IrisCamMonitor-macOS.zip
          if-no-files-found: error
          retention-days: 14
