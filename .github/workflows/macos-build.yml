name: macOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Iris Cam Monitor
        run: xcodebuild -project IrisCamMonitor.xcodeproj -scheme IrisCamMonitor -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO build
